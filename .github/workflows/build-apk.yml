    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK and CMake
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "cmake;3.22.1" "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      working-directory: HyperOS_Flagship_Camera
      run: gradle assembleDebug --stacktrace --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Camera-Debug-APK
        path: HyperOS_Flagship_Camera/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: HyperOS Camera v1.0.${{ github.run_number }}
        files: HyperOS_Flagship_Camera/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
